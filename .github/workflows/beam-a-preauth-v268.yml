name: Beam A current Action control

on:
  issue_comment:
    types: [created]

jobs:
  a_current:
    if: >-
      github.event.issue.pull_request != null &&
      github.actor == 'PSDtheMIC' &&
      contains(github.event.comment.body, '@claude beam-a-v268')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
      issues: write
    env:
      ANTHROPIC_CUSTOM_HEADERS: 'X-HackerOne-Handle: psdmic'
    steps:
      - name: Checkout owned baseline
        uses: actions/checkout@v4
      - name: Run pinned current Claude Code Action without a model credential
        uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c
